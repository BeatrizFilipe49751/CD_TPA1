syntax = "proto3";

option java_multiple_files = true;
option java_package = "ringmanagerstubs";

package ringmanagerservice; // package do proto

service RingManagerService {
    rpc registServer(EndPoint) returns (Response);

    rpc nextRingserver(Request) returns (EndPoint);
}

message EndPoint {
  string ip = 1;
  int32 port = 2;
}

message Response {
  bool success = 1;
  string id = 2;
}

message Request {
  string id = 1;
}