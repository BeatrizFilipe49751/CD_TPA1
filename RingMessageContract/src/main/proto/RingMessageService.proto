syntax = "proto3";

option java_multiple_files = true;
option java_package = "ringmessagestubs";

package ringmessageservice; // package do proto

service RingMessageService {
    rpc ringMessage(stream RingRequest) returns (RingResponse);
}

// Message sent between PrimeServers
message RingRequest {
    int64 number = 1;   // Number being checked
    bool hasInfo = 2;   // Whether the information is known
    bool isPrime = 3;   // The prime result
    string originIp = 4; // IP of the originating server
    int32 originPort = 5; // Port of the originating server
}

// Response from the server to the client after going through the ring
message RingResponse {
    bool isPrime = 1;
}
