syntax = "proto3";

option java_multiple_files = true;
option java_package = "ringmessagestubs";

package ringmessageservice; // package do proto

service RingMessageService {
    rpc ringMessage(Request) returns (Response);
}

message Response {
  string id = 1;
  bool is_prime = 2;
}

message Request {
  string id = 1;
  int64 number = 2;
  bool is_known = 3;
}